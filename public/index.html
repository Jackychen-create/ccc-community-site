<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D1017">
<title>會員專區</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<!-- 開機中 -->
<div id="bootView" class="center-msg"><span class="spinner" aria-label="載入中"></span></div>

<!-- 登入／註冊 -->
<div id="authView" class="auth" hidden>
  <header class="topbar">
    <a class="brand" href="/"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 15l4-5 3 3 4-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-site-name></span></a>
    <span class="spacer"></span>
    <span class="small muted">僅限受邀會員</span>
  </header>
  <main class="auth-main">
    <section class="auth-intro rise">
      <div class="label">會員專區</div>
      <h1>每一場直播的重點，<br>留在這裡慢慢看</h1>
      <p>直播留檔與教材只開放給受邀會員。第一次來請用邀請碼註冊，之後用 Email 登入就能回看，換手機或電腦也會記得你看到哪裡。</p>
      <div class="card replay" style="margin-top: 24px">
        <div class="replay-head">

            <g class="candle" style="animation-delay:0.70s"><line x1="328.0" y1="42.1" x2="328.0" y2="59.0" stroke="var(--ink-3)" stroke-width="1.2"/><rect x="323.6" y="46.3" width="8.8" height="9.6" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.2"/></g>
            <g class="candle" style="animation-delay:0.74s"><line x1="344.0" y1="39.7" x2="344.0" y2="63.6" stroke="var(--slate)" stroke-width="1.2"/><rect x="339.6" y="46.3" width="8.8" height="13.7" fill="var(--slate)"/></g>
            <g class="candle" style="animation-delay:0.77s"><line x1="360.0" y1="28.2" x2="360.0" y2="69.9" stroke="var(--ink-3)" stroke-width="1.2"/><rect x="355.6" y="42.0" width="8.8" height="18.0" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.2"/></g>
            <g class="candle" style="animation-delay:0.81s"><line x1="376.0" y1="27.3" x2="376.0" y2="45.9" stroke="var(--ink-3)" stroke-width="1.2"/><rect x="371.6" y="37.1" width="8.8" height="4.9" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.2"/></g>
            <g class="candle" style="animation-delay:0.84s"><line x1="392.0" y1="20.0" x2="392.0" y2="61.1" stroke="var(--slate)" stroke-width="1.2"/><rect x="387.6" y="37.1" width="8.8" height="21.6" fill="var(--slate)"/></g>
            <g class="candle" style="animation-delay:0.88s"><line x1="408.0" y1="51.1" x2="408.0" y2="72.5" stroke="var(--slate)" stroke-width="1.2"/><rect x="403.6" y="58.7" width="8.8" height="7.2" fill="var(--slate)"/></g>
            <g class="candle" style="animation-delay:0.91s"><line x1="424.0" y1="49.1" x2="424.0" y2="67.5" stroke="var(--ink-3)" stroke-width="1.2"/><rect x="419.6" y="50.2" width="8.8" height="15.7" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.2"/></g>
            <g class="candle" style="animation-delay:0.95s"><line x1="440.0" y1="32.0" x2="440.0" y2="54.4" stroke="var(--ink-3)" stroke-width="1.2"/><rect x="435.6" y="42.8" width="8.8" height="7.4" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.2"/></g>

            <g class="candle" style="animation-delay:1.02s"><line x1="472.0" y1="10.0" x2="472.0" y2="38.0" stroke="var(--ink-3)" stroke-width="1.2"/><rect x="467.6" y="16.5" width="8.8" height="17.9" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.2"/></g>
          <line class="playhead" x1="0" y1="2" x2="0" y2="160" stroke="var(--brass)" stroke-width="1.5"/>
        </svg>
        <div class="scrub"><i></i></div>
        <div class="scrub-meta small muted num"><span>直播留檔</span><span>隨時回看</span></div>
      </div>
    </section>

    <section class="auth-card card rise" style="animation-delay: .08s; padding: 28px">
      <h2 id="authTitle" style="font-size: 20px">登入</h2>
      <p id="authSub" class="muted" style="margin: 4px 0 20px">登入以觀看直播留檔</p>
      <div class="seg" role="tablist" aria-label="登入或註冊">
        <button type="button" role="tab" id="tabLogin" aria-selected="true">登入</button>
        <button type="button" role="tab" id="tabRegister" aria-selected="false">邀請碼註冊</button>
      </div>
      <form id="authForm" novalidate>
        <label class="field"><span class="label">Email</span>
          <input class="input" id="email" type="email" autocomplete="email" inputmode="email" required>
        </label>
        <label class="field"><span class="label" id="pwLabel">密碼</span>
          <span class="input-wrap" style="display: block">
            <input class="input" id="password" type="password" autocomplete="current-password" minlength="8" required>
            <button class="btn ghost reveal" type="button" id="revealPw" aria-label="顯示密碼" aria-pressed="false"></button>
          </span>
        </label>
        <label class="field" id="inviteRow" hidden><span class="label">邀請碼</span>
          <input class="input" id="invite" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="例如 ABCD-EFGH">
          <span class="hint">邀請碼由管理員提供，每組有使用次數限制</span>
        </label>
        <div id="authError" class="form-error" role="alert" hidden></div>
        <button class="btn primary lg block" id="authSubmit" type="submit" style="margin-top: 22px">登入</button>
        <p class="small muted" style="margin-top: 14px; text-align: center">忘記密碼請聯絡管理員重設</p>
      </form>
    </section>
  </main>
</div>

<!-- 帳號被停用 -->
<div id="blockedView" class="center-msg" hidden>
  <div class="card">
    <h2>沒有觀看權限</h2>
    <p id="blockedMsg">這個帳號目前沒有觀看權限，請聯絡管理員。</p>
    <button class="btn" type="button" id="blockedLogout">登出</button>
  </div>
</div>

<!-- 會員內容 -->
<div id="appView" hidden>
  <header class="topbar">
    <a class="brand" href="#/"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 15l4-5 3 3 4-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-site-name></span></a>
    <span class="spacer"></span>
    <label class="search" id="searchBox">
      <span class="sr-only">搜尋影片</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input class="input" id="search" type="search" placeholder="搜尋標題或內容" autocomplete="off">
    </label>
    <div class="menu">
      <button class="btn ghost icon" type="button" id="menuBtn" aria-haspopup="menu" aria-expanded="false" aria-label="帳號選單"><span class="avatar" id="avatar">·</span></button>
      <div class="menu-panel" id="menuPanel" role="menu" hidden></div>
    </div>
  </header>

  <main id="listView" class="page">
    <div class="page-head rise">
      <div>
        <div class="label">會員專區</div>
        <h1 style="margin-top: 6px">直播留檔</h1>
        <p>點選影片就能播放，系統會記住你看到哪裡</p>
      </div>
      <span class="small muted" id="countText"></span>
    </div>
    <section id="continueSec" hidden>
      <div class="section-label"><span class="label">繼續觀看</span></div>
      <div class="continue" id="continueList"></div>
    </section>
    <div class="chips" id="chips" role="group" aria-label="篩選" style="margin-bottom: 20px"></div>
    <div class="grid" id="grid" aria-live="polite"></div>
  </main>

  <main id="watchView" class="page" hidden>
    <a class="back" href="#/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>直播留檔</a>
    <div class="watch">
      <section class="watch-main">
        <div class="player" id="player">
          <video id="video" controls playsinline preload="metadata" controlslist="nodownload"></video>
          <div class="loading" id="videoLoading"><span class="spinner"></span></div>
        </div>
        <div class="toolbar">
          <div class="speed" id="speed" role="group" aria-label="播放速度"></div>
          <span class="small muted hide-sm"><span class="kbd">空白</span> 播放／暫停　<span class="kbd">←</span><span class="kbd">→</span> 10 秒　<span class="kbd">F</span> 全螢幕</span>
        </div>
        <div id="watchNotice"></div>
        <h1 id="wTitle"></h1>
        <div class="vmeta" id="wMeta"></div>
        <p class="desc" id="wDesc"></p>
        <section class="files" id="wFiles" hidden>
          <div class="section-label"><span class="label">教材下載</span></div>
          <div id="wFileList"></div>
        </section>
      </section>
      <aside class="watch-side">
        <div class="section-label"><span class="label">其他場次</span></div>
        <div class="side-list" id="others"></div>
      </aside>
    </div>
  </main>
</div>

<script src="/vendor/supabase.js"></script>
<script src="/config.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/member.js"></script>
</body>
</html>
